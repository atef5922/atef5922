name: Update GitHub Statistics

on:
  # Actions tab থেকে manually run করার জন্য
  workflow_dispatch:

  # প্রতিদিন automatic update করার জন্য
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  generate-statistics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"atef5922","show_icons":true,"include_all_commits":true,"theme":"tokyonight","hide_border":true,"bg_color":"0D1117","title_color":"58A6FF","icon_color":"7C3AED","text_color":"C9D1D9","custom_title":"GitHub Statistics"}'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate most-used languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: '{"username":"atef5922","layout":"compact","langs_count":8,"theme":"tokyonight","hide_border":true,"bg_color":"0D1117","title_color":"58A6FF","text_color":"C9D1D9","custom_title":"Most Used Languages"}'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No statistics changes found."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi
